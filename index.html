<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Shae 🌹</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Georgia, serif;
  color: white;
  text-align: center;
}

/* Button */
#startBtn {
  font-size: 24px;
  padding: 15px 40px;
  background: crimson;
  border: none;
  border-radius: 50px;
  color: white;
  cursor: pointer;
  z-index: 9999;
}

/* Message */
#message {
  position: absolute;
  font-size: 38px;
  max-width: 900px;
  opacity: 0;
  transition: opacity 2s ease;
}

.name {
  color: hotpink;
  font-weight: bold;
}

/* Roses */
.rose {
  position: fixed;
  bottom: -120px;
  font-size: 80px;
  animation: rise 6s linear forwards;
}

@keyframes rise {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-120vh); opacity: 0; }
}
</style>
</head>

<body>

<button id="startBtn">Click Me ❤️</button>

<div id="message">
HAPPY VALENTINE'S DAY <span class="name">SHAE</span> 👑<br><br>
YOU AREEEEE THAT WOMAN<br>
AND DESERVE EVERY GOOD THING<br>
AND MORE FROM THIS LIFETIME ❤️
</div>

<script>
const btn = document.getElementById("startBtn");
const message = document.getElementById("message");

btn.addEventListener("click", () => {

  // TEST alert to confirm click works
  console.log("Button clicked");

  btn.style.display = "none";
  message.style.opacity = "1";

  for (let i = 0; i < 50; i++) {
    setTimeout(() => {
      const rose = document.createElement("div");
      rose.className = "rose";
      rose.innerText = "🌹";
      rose.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(rose);

      setTimeout(() => rose.remove(), 6000);
    }, i * 100);
  }

});
</script>

</body>
</html>
