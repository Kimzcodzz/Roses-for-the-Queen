<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Shae 🌹</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #fff0f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .link {
      font-size: 24px;
      color: #e60073;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .rose {
      position: fixed;
      bottom: -100px;
      font-size: 80px;
      animation: rise 3s ease-out forwards;
      pointer-events: none;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.3);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <a class="link" id="trigger">Click me 🌹</a>

  <script>
    const trigger = document.getElementById("trigger");

    trigger.addEventListener("click", () => {
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const rose = document.createElement("div");
          rose.classList.add("rose");
          rose.innerText = "🌹";
          rose.style.left = Math.random() * 100 + "vw";
          document.body.appendChild(rose);

          setTimeout(() => {
            rose.remove();
          }, 3000);
        }, i * 100);
      }
    });
  </script>

</body>
</html>
